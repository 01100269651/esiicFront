<div class="dmsidebar-container">
  <aside class="dmsidebar">
    <!-- Menu Section -->
    <div class="dmsidebar-header">
      <mat-icon>menu_book</mat-icon>
      <span>عناصر مهمة</span>
    </div>
    
    <div class="dmsidebar-menu-container">
      <ul class="dmsidebar-menu">
        <li class="dmsidebar-menu-item" [class.open]="isMenuOpen">
          <a href="javascript:void(0)" class="dmsidebar-menu-toggle" (click)="toggleMenu()">
            <mat-icon class="dmsidebar-icon">dashboard</mat-icon>
            <span>عناصر مهمة</span>
            <mat-icon class="dmsidebar-arrow">chevron_right</mat-icon>
          </a>
          
          <ul class="dmsidebar-submenu" [class.show]="isMenuOpen">
            <li>
              <a [routerLink]="['OrdList']" class="dmsidebar-submenu-link" routerLinkActive="active">
                <mat-icon>pending_actions</mat-icon>
                <span>الطلبات الغير معتمدة</span>
              </a>
            </li>
            <li>
              <a [routerLink]="['signedOrders']" class="dmsidebar-submenu-link" routerLinkActive="active">
                <mat-icon>check_circle</mat-icon>
                <span>الطلبات المعتمدة</span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>

    <!-- Table Section -->
    <div class="dmsidebar-table-container">
      <div class="dmsidebar-table-header">
        <mat-icon>assignment</mat-icon>
        <span>الطلبات الأخيرة</span>
      </div>
      <table class="dmsidebar-table" mat-table [dataSource]="itms">
        <ng-container matColumnDef="main_Dept">
          <th mat-header-cell *matHeaderCellDef>قسم طالب</th>
          <td mat-cell *matCellDef="let element">{{element.main_Dept}}</td>
        </ng-container>
        
        <ng-container matColumnDef="ord_Date">
          <th mat-header-cell *matHeaderCellDef>تاريخ</th>
          <td mat-cell *matCellDef="let element">{{element.ord_Date | date: "yyyy/MM/dd"}}</td>
        </ng-container>
        
        <ng-container matColumnDef="ord_Id">
          <th mat-header-cell *matHeaderCellDef>رقم</th>
          <td mat-cell *matCellDef="let element">{{element.ord_Id}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
            [ngClass]="{'dmsidebar-row-warning': row.tran_Code==2}"></tr>
      </table>
    </div>
  </aside>
</div>
